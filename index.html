<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de Reestructuración</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: header navy PETROSAR + menú lateral de temas + panel de detalle. Single light look (sistema PETROSAR). */
:root{
  --bg:#f0f2f6;--card:#fff;--border:#e2e8f0;--text:#1a202c;--muted:#718096;--label:#4a5568;
  --navy:#1e2d3e;--navy2:#192638;--accent:#e8a020;
  --ok-bg:#c6f6d5;--ok:#276749;--warn-bg:#fef3c7;--warn:#92400e;--bad-bg:#fed7d7;--bad:#9b2c2c;--info-bg:#bee3f8;--info:#2c5282;--pur-bg:#e9d8fd;--pur:#553c9a;--gray-bg:#edf2f7;
  --font:'IBM Plex Sans',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header{position:relative;background:linear-gradient(160deg,#253445 0%,var(--navy2) 100%);color:#fff}
header .wrap{padding-block:18px 20px}
.top{display:flex;align-items:center;gap:12px}
.top img{width:40px;height:40px;border-radius:10px;object-fit:contain;box-shadow:0 4px 12px rgba(0,0,0,.3)}
h1{font-weight:700;font-size:clamp(20px,3vw,25px);margin:0;letter-spacing:-.2px;text-wrap:balance}
.sub{font-size:13px;color:rgba(255,255,255,.6)}
.hk{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.hk div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:9px 13px}
.hk b{display:block;font-size:21px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.hk span{font-size:12px;color:rgba(255,255,255,.65)}
main .wrap{padding-block:16px 32px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}.menu{position:static}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);min-width:0}
.menu{padding:8px;position:sticky;top:12px}
.menu h2{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:6px 8px 6px;font-weight:600}
.mi{display:grid;grid-template-columns:26px 1fr;gap:2px 8px;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;font:inherit;color:inherit;align-items:center}
.mi:hover{background:#f7fafc}
.mi[aria-current="true"]{background:var(--navy);color:#fff}
.mi[aria-current="true"] .mn{background:var(--accent);color:var(--navy)}
.mi[aria-current="true"] .ms{color:rgba(255,255,255,.7)}
.mi:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mn{grid-row:span 2;width:26px;height:26px;border-radius:7px;background:var(--gray-bg);display:grid;place-items:center;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.mt{font-weight:600;font-size:13.5px;line-height:1.25}
.ms{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.e-pendiente{background:var(--gray-bg);color:var(--muted)}.e-relevamiento{background:var(--info-bg);color:var(--info)}.e-evaluacion{background:var(--pur-bg);color:var(--pur)}.e-propuesta{background:var(--warn-bg);color:var(--warn)}.e-aprobada{background:var(--ok-bg);color:var(--ok)}.e-implementada{background:#276749;color:#fff}
.t-analisis{background:#e6edf5;color:var(--navy)}.t-presentacion{background:#fdebd3;color:#7b4a0e}.t-definir{background:var(--gray-bg);color:var(--muted)}
.detail{padding:18px 20px}
.dh{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:14px}
.dh h2{margin:0;font-size:20px;font-weight:700;line-height:1.2}
.dh .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dh .act{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:7px 14px;font:600 13px var(--font);cursor:pointer;color:var(--text)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kp div{background:#f7fafc;border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.kp b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.kp span{font-size:11.5px;color:var(--muted)}
h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:16px 0 8px;font-weight:600}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lk{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px;text-decoration:none;color:var(--text);background:#fff;transition:box-shadow .15s,transform .15s}
.lk:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.lk i{width:34px;height:34px;border-radius:9px;background:var(--navy);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;flex:none}
.lk b{display:block;font-weight:600;font-size:13.5px;line-height:1.25}
.lk small{color:var(--muted);font-size:11.5px;word-break:break-all;display:block;max-height:2.6em;overflow:hidden}
.mrow,.tcw{position:relative}
.info{position:absolute;right:8px;top:8px;border:1px solid var(--border);background:#fff;border-radius:7px;font:600 11px var(--font);color:var(--label);padding:3px 8px;cursor:pointer}
.mrow .mi{padding-right:76px;text-decoration:none}
a.tc{text-decoration:none}
.tcw .tc{height:100%;padding-right:80px}
.sv{margin-bottom:16px;background:#fff}
.svf{background:#1e2d3e;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;max-width:100%}
.svf{position:relative;cursor:pointer;user-select:none;-webkit-user-select:none}
.svf img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .35s ease}
.svf img.on{opacity:1}
.svbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18)}
.svbar i{display:block;height:100%;width:0;background:#E8A020;transition:width .35s ease}
.svh{font-size:11.5px;color:var(--muted);text-align:center;margin:6px 0 0}
.svc,.svh{transition:opacity .3s}
.sv.idle .svc,.sv.idle .svh{opacity:0}
.sv.idle{cursor:none}
.sv:fullscreen .svh{color:rgba(255,255,255,.6)}
.svc{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap;font-size:13px;color:var(--label);font-variant-numeric:tabular-nums}
.sv:fullscreen{background:#1e2d3e;display:flex;flex-direction:column;justify-content:center;padding:16px}
.sv:fullscreen .svf{border-radius:0;flex:1;aspect-ratio:auto}
.sv:fullscreen .svc{color:#fff}
.notes{white-space:pre-wrap;background:#f7fafc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:44px}
.empty{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tc{border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px}
.tc:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.tc .row{display:flex;gap:6px;flex-wrap:wrap}
.tc .fig{font-size:12px;color:var(--label);font-variant-numeric:tabular-nums}
form .fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;color:var(--label)}
input,select,textarea{font:400 13.5px var(--font);padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);width:100%}
textarea{min-height:70px;resize:vertical}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:8px;margin-bottom:6px}
@media (max-width:520px){.lrow{grid-template-columns:1fr}}
.msg{font-size:12.5px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.foot{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.foot .msg{margin-right:auto}
.state{padding:28px;text-align:center;color:var(--muted)}
.modw{margin:0 -20px -18px;border-top:1px solid var(--border);background:#f0f2f6;border-radius:0 0 14px 14px;overflow:hidden}
.modf{display:block;width:100%;border:0;height:600px;background:#f0f2f6}
.vt{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:-4px 0 14px;overflow-x:auto}
.vt button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:500 13.5px var(--font);color:var(--muted);cursor:pointer;white-space:nowrap}
.vt button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--accent);font-weight:600}
.pcg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:6px}
.pcg div{background:#f7fafc;border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.pcg b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.pcg span{font-size:11.5px;color:var(--muted)}
.pc-sin{background:var(--gray-bg);color:var(--muted)}.pc-prep{background:var(--info-bg);color:var(--info)}.pc-pres{background:var(--warn-bg);color:var(--warn)}.pc-neg{background:var(--pur-bg);color:var(--pur)}.pc-acep{background:var(--ok-bg);color:var(--ok)}.pc-rech{background:var(--bad-bg);color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    window.__svGo=function(d){var j=Math.max(0,Math.min(S.length-1,i+d));if(j!==i){i=j;show()}};
    window.__svTo=function(j){j=Math.max(0,Math.min(S.length-1,j));if(j!==i){i=j;show()}};
    $('sv-p').onclick=function(){__svGo(-1)};$('sv-x').onclick=function(){__svGo(1)};
    $('sv-f').onclick=svFull;
    $('svf').onclick=function(e){var r=this.getBoundingClientRect();__svGo(e.clientX-r.left<r.width*0.35?-1:1)};
    var tx=null;$('svf').addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
    $('svf').addEventListener('touchend',function(e){if(tx==null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40){e.preventDefault();__svGo(dx<0?1:-1)}});
    show(true);
  } else {window.__svGo=null}
}
function loadMod(k){
  var f=$('modf');if(!f)return;
  var html;try{html=new TextDecoder().decode(Uint8Array.from(atob(window.__MODS[k]),function(c){return c.charCodeAt(0)}))}catch(e){f.outerHTML='<p class="state">No se pudo abrir esta sección.</p>';return}
  var inj='<style>header .top{display:none!important}header .wrap{padding-block:12px 14px!important}header .hk{margin-top:0!important}#t-pc,#p-pc{display:none!important}.tabs{position:static!important}html,body{background:#f0f2f6}</style>'+
   '<script>(function(){var h=document.querySelector("header");if(h&&!h.querySelector(".hk"))h.style.display="none";var s=document.querySelector(".tab[aria-selected=true]");if(!s||getComputedStyle(s).display==="none"){var t=document.querySelector(".tab");if(t)t.click()}})()<\/script>';
  html=html.replace(/<\/body>\s*<\/html>\s*$/i,'')+inj;
  f.onload=function(){try{var d=f.contentDocument,fit=function(){var hh=Math.ceil(d.body.getBoundingClientRect().height)+4;if(Math.abs(f.offsetHeight-hh)>2)f.style.height=hh+'px'};fit();
    if(window.ResizeObserver)new ResizeObserver(fit).observe(d.body);d.addEventListener('click',function(){setTimeout(fit,30)});setTimeout(fit,400)}catch(e){}};
  f.srcdoc=html;
}
function pcView(t){
  var c=t.pc||{}, e=c.estado||'sin', a=num(c.actual), p=num(c.propuesto), dif=a!=null&&p!=null?p-a:null;
  var h='<div class="pcg"><div><b><span class="badge pc-'+e+'">'+lab(PCE,e)+'</span></b><span>Estado de la propuesta</span></div>'+
   '<div><b>'+esc(c.destinatario||'—')+'</b><span>Cliente / destinatario</span></div>'+
   '<div><b>'+fd(c.fecha)+'</b><span>Fecha de presentación</span></div></div>'+
   '<div class="pcg"><div><b>'+money(a,c.moneda)+'</b><span>Monto actual (mensual)</span></div>'+
   '<div><b>'+money(p,c.moneda)+'</b><span>Monto propuesto (mensual)</span></div>'+
   '<div><b'+(dif!=null?' style="color:'+(dif<0?'var(--ok)':dif>0?'var(--bad)':'inherit')+'"':'')+'>'+(dif==null?'—':(dif>0?'+':dif<0?'−':'')+money(Math.abs(dif),c.moneda).replace(/^(USD |\$ )/,'$1')+(a?' ('+(dif>0?'+':'')+(dif/a*100).toFixed(1).replace('.',',')+'%)':''))+'</b><span>Variación mensual</span></div></div>';
  h+='<h3>Documento</h3>'+(c.doc?'<div class="links"><a class="lk" href="'+esc(c.doc)+'" target="_blank" rel="noopener"><i>$</i><span style="min-width:0"><b>'+esc(c.docT||'Propuesta comercial')+'</b><small>'+(/^\/_blob\//.test(c.doc)?'Archivo guardado en el panel':esc(c.doc.replace(/^https?:\/\//,'')))+'</small></span></a></div>':'<p class="empty">Sin documento cargado.</p>');
  h+='<h3>Alcance y condiciones</h3><div class="notes">'+(c.notas?esc(c.notas):'<span class="empty">'+(t.pc?'Sin detalle.':'Todavía no se cargó la propuesta comercial de este tema. Usá Editar propuesta.')+'</span>')+'</div>';
  if(c.actualizado)h+='<p class="empty" style="margin-top:10px;font-size:11.5px">Actualizado: '+new Date(c.actualizado).toLocaleString('es-AR')+'</p>';
  return h;
}
function pcEdit(t){
  var c=t.pc||{};
  $('detail').innerHTML='<form id="pf"><div class="dh"><div><h2>Propuesta comercial · '+t.orden+'. '+esc(t.nombre)+'</h2></div></div>'+
   '<div class="fg"><label class="f">Estado<select id="p-e">'+PCE.map(function(x){return '<option value="'+x[0]+'"'+((c.estado||'sin')===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label>'+
   '<label class="f">Cliente / destinatario<input id="p-d" value="'+esc(c.destinatario)+'"></label>'+
   '<label class="f">Fecha de presentación<input type="date" id="p-f" value="'+esc(c.fecha)+'"></label>'+
   '<label class="f">Moneda<select id="p-m"><option value="ARS"'+(c.moneda!=='USD'?' selected':'')+'>Pesos (ARS)</option><option value="USD"'+(c.moneda==='USD'?' selected':'')+'>Dólares (USD)</option></select></label>'+
   '<label class="f">Monto actual (mensual)<input type="number" min="0" step="any" id="p-a" value="'+esc(c.actual)+'"></label>'+
   '<label class="f">Monto propuesto (mensual)<input type="number" min="0" step="any" id="p-p" value="'+esc(c.propuesto)+'"></label></div>'+
   '<h3>Documento</h3><div class="lrow" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)"><input id="p-dt" placeholder="Nombre (ej. Propuesta PDF)" value="'+esc(c.docT)+'"><input id="p-du" placeholder="https://…" value="'+esc(c.doc)+'"></div>'+
   '<h3>Alcance y condiciones</h3><textarea id="p-n">'+esc(c.notas)+'</textarea>'+
   '<div class="foot"><span class="msg" id="p-msg"></span><button class="btn" type="button" id="p-c">Cancelar</button><button class="btn pri" type="submit" id="p-s">Guardar</button></div></form>';
  $('p-c').onclick=function(){editing=false;view(t)};
  $('pf').onsubmit=async function(e){
    e.preventDefault();
    var du=$('p-du').value.trim();
    if(du&&!/^(https:\/\/|\/_blob\/)/.test(du)){$('p-msg').textContent='El enlace del documento tiene que empezar con https://';$('p-msg').className='msg err';return}
    var pc={estado:$('p-e').value,destinatario:$('p-d').value.trim(),fecha:$('p-f').value,moneda:$('p-m').value,actual:num($('p-a').value),propuesto:num($('p-p').value),docT:$('p-dt').value.trim(),doc:du,notas:$('p-n').value.trim(),actualizado:new Date().toISOString()};
    var d=base(t);d.pc=pc;
    $('p-s').disabled=true;$('p-msg').textContent='Guardando…';$('p-msg').className='msg';
    try{await db.doc('temas/'+t.id).set(d);editing=false;render()}
    catch(err){$('p-s').disabled=false;$('p-msg').textContent=err&&err.code==='invalid_argument'?'Clave de edición incorrecta.':'No se pudo guardar. Probá de nuevo.';$('p-msg').className='msg err'}
  };
}
function edit(t){
  var L=(t.links||[]).slice(); if(!L.length)L.push({t:'',u:''});
  function lrows(){return L.map(function(l,i){return '<div class="lrow"><input id="lt'+i+'" placeholder="Nombre (ej. Presentación PPT)" value="'+esc(l.t)+'"><input id="lu'+i+'" placeholder="https://…" value="'+esc(l.u)+'"><button class="btn sm" type="button" data-rm="'+i+'">Quitar</button></div>'}).join('')}
  $('detail').innerHTML='<form id="ef"><div class="dh"><div><h2>Editar · '+t.orden+'. '+esc(t.nombre)+'</h2></div></div>'+
   '<div class="fg"><label class="f">Nombre<input id="f-n" value="'+esc(t.nombre)+'"></label>'+
   '<label class="f">Tipo de entregable<select id="f-t">'+TIPOS.map(function(x){return '<option value="'+x[0]+'"'+(t.tipo===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label>'+
   '<label class="f">Estado<select id="f-e">'+ESTADOS.map(function(x){return '<option value="'+x[0]+'"'+(t.estado===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label>'+
   '<label class="f">Responsable<input id="f-r" value="'+esc(t.responsable)+'"></label>'+
   '<label class="f">Próxima revisión<input type="date" id="f-p" value="'+esc(t.proxima)+'"></label>'+
   '<label class="f">Avance (texto corto)<input id="f-a" value="'+esc(t.avance)+'" placeholder="ej. Fichas 12/39"></label>'+
   '<label class="f">Dotación actual<input type="number" min="0" id="f-h" value="'+esc(t.hoy)+'"></label>'+
   '<label class="f">Propuesta esc. A<input type="number" min="0" id="f-pa" value="'+esc(t.propA)+'"></label>'+
   '<label class="f">Propuesta esc. B<input type="number" min="0" id="f-pb" value="'+esc(t.propB)+'"></label></div>'+
   '<h3>Accesos</h3><div id="lr">'+lrows()+'</div><button class="btn sm" type="button" id="l-add">Agregar acceso</button>'+
   '<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px;font-weight:500"><input type="checkbox" id="f-d" style="width:auto"'+(t.directo?' checked':'')+'> Al tocar el tema, abrir directamente el primer acceso</label>'+
   '<h3>Notas</h3><textarea id="f-no">'+esc(t.notas)+'</textarea>'+
   '<div class="foot"><span class="msg" id="f-m"></span><button class="btn" type="button" id="f-c">Cancelar</button><button class="btn pri" type="submit" id="f-s">Guardar</button></div></form>';
  function sync(){L=L.map(function(_,i){return {t:$('lt'+i).value,u:$('lu'+i).value}})}
  $('l-add').onclick=function(){sync();L.push({t:'',u:''});$('lr').innerHTML=lrows()};
  $('lr').onclick=function(e){var r=e.target.getAttribute('data-rm');if(r!=null){sync();L.splice(+r,1);$('lr').innerHTML=lrows()}};
  $('f-c').onclick=function(){editing=false;view(t)};
  $('ef').onsubmit=async function(e){
    e.preventDefault();sync();
    var links=L.filter(function(l){return l.t.trim()||l.u.trim()});
    for(var i=0;i<links.length;i++){if(!/^(https:\/\/|\/_blob\/)/.test(links[i].u.trim())){$('f-m').textContent='Cada acceso necesita un enlace que empiece con https://';$('f-m').className='msg err';return}}
    var d=Object.assign(base(t),{orden:t.orden,nombre:$('f-n').value.trim()||t.nombre,tipo:$('f-t').value,estado:$('f-e').value,responsable:$('f-r').value.trim(),proxima:$('f-p').value,avance:$('f-a').value.trim(),
      hoy:num($('f-h').value),propA:num($('f-pa').value),propB:num($('f-pb').value),notas:$('f-no').value.trim(),directo:$('f-d').checked,links:links.map(function(l){return {t:l.t.trim()||'Acceso',u:l.u.trim()}}),actualizado:new Date().toISOString()});
    $('f-s').disabled=true;$('f-m').textContent='Guardando…';$('f-m').className='msg';
    try{await db.doc('temas/'+t.id).set(d);editing=false;$('f-m').textContent='Guardado.';$('f-m').className='msg ok'}
    catch(err){$('f-s').disabled=false;$('f-m').textContent=err&&err.code==='invalid_argument'?'Clave de edición incorrecta.':'No se pudo guardar. Probá de nuevo.';$('f-m').className='msg err';if(err&&err.code==='invalid_argument')canWrite=false}
  };
}
function render(){
  kpis();menu();
  if(editing) return;
  var t=T.filter(function(x){return x.id===sel})[0];
  if(t) view(t); else {sel=null;$('m-all').setAttribute('aria-current','true');overview()}
}
function svFull(){var el=$('sv');if(!el)return;try{if(document.fullscreenElement){document.exitFullscreen()}else{var r=el.requestFullscreen&&el.requestFullscreen();if(r&&r.catch)r.catch(function(){})}}catch(e){}}
var idleT=null;document.addEventListener('mousemove',function(){var el=$('sv');if(!el)return;el.classList.remove('idle');clearTimeout(idleT);if(document.fullscreenElement===el)idleT=setTimeout(function(){el.classList.add('idle')},2000)});
document.addEventListener('keydown',function(e){
  if(!$('sv')||!window.__svGo||editing||e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=(e.target.tagName||''),k=e.key;if(/INPUT|TEXTAREA|SELECT/.test(tg))return;
  if(['Tab','Shift','Control','Alt','Meta','Escape','CapsLock','ContextMenu'].indexOf(k)>=0)return;
  if((tg==='BUTTON'||tg==='A')&&(k==='Enter'||k===' ')&&!(e.target.closest&&e.target.closest('#sv')))return;
  if(k==='f'||k==='F'){e.preventDefault();svFull();return}
  if(k==='Home'){e.preventDefault();__svTo(0);return}
  if(k==='End'){e.preventDefault();__svTo(1e9);return}
  e.preventDefault();__svGo(['ArrowLeft','ArrowUp','PageUp','Backspace'].indexOf(k)>=0?-1:1);
});
function go(id){editing=false;sel=id;render();if(window.innerWidth<820)$('detail').scrollIntoView({block:'start'});try{localStorage.setItem('pr-sel',id||'')}catch(e){}}
$('menu').onclick=function(e){var b=e.target.closest('[data-id]');if(b)go(b.getAttribute('data-id'))};
$('detail').addEventListener('click',function(e){var b=e.target.closest('.tc[data-id],.info[data-id]');if(b)go(b.getAttribute('data-id'))});
$('m-all').onclick=function(){go(null)};
try{sel=localStorage.getItem('pr-sel')||null;vtab=localStorage.getItem('pr-vt')==='pc'?'pc':'con'}catch(e){}
var CFG=window.APP_CONFIG||{};
function sbHeaders(){return {apikey:CFG.SUPABASE_ANON_KEY,Authorization:'Bearer '+CFG.SUPABASE_ANON_KEY}}
function getKey(){try{return localStorage.getItem('rp-key')||''}catch(e){return ''}}
async function loadT(){
  var rows=null;
  if(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&CFG.SUPABASE_URL.indexOf('TU-PROYECTO')<0){
    try{var res=await fetch(CFG.SUPABASE_URL+'/rest/v1/reestr_temas?select=id,data',{headers:sbHeaders()});if(res.ok)rows=await res.json()}catch(e){}
  }
  var FB={};window.__TEMAS.forEach(function(t){FB[t.id]=t});
  var src=rows&&rows.length?rows.map(function(x){var o=Object.assign({},x.data);o.id=x.id;var f=FB[x.id];if(f&&f.slides&&f.slides.length&&(!(o.slides&&o.slides.length)||/^data:/.test(f.slides[0]))){o.slides=f.slides;if(f.tipo)o.tipo=f.tipo}if(o.slides)o.slides=o.slides.map(function(u){return String(u).replace(/^slides\//,'')});return o}):window.__TEMAS;
  online=!!(rows&&rows.length);
  T=src.slice().sort(function(a,b){return (a.orden||99)-(b.orden||99)});
}
db={doc:function(path){var id=path.split('/')[1];return {set:async function(d){
  var res=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,data:d,key:getKey()})});
  if(res.status===401){var e=new Error('clave');e.code='invalid_argument';throw e}
  if(!res.ok)throw new Error('save');
  await loadT();setTimeout(render,0);
}}}};
function editBtn(){var b=$('b-mode');if(!b)return;b.textContent=canWrite?'Salir de edición':'Modo edición';b.hidden=!online}
$('b-mode').onclick=async function(){
  if(canWrite){canWrite=false;try{localStorage.removeItem('rp-key')}catch(e){};editBtn();render();return}
  var k=prompt('Clave de edición');if(!k)return;
  try{var res=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({check:true,key:k})});
    if(res.ok){try{localStorage.setItem('rp-key',k)}catch(e){};canWrite=true;editBtn();render()}else if(res.status===401)alert('Clave incorrecta.');else alert('La función de guardado no respondió (código '+res.status+'). Revisá que la carpeta api esté en GitHub y las variables en Vercel.')}catch(e){alert('No se pudo verificar la clave.')}
};
(async function(){await loadT();canWrite=online&&!!getKey();editBtn();render()})();
})();
</script>
